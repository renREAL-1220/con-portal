<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saint Ferdinand College - Test Practice Suite</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sfcGreen: '#1b4d3e',
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col justify-between">

    <!-- Header / Navigation Bar -->
    <header class="bg-emerald-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <img src="1000054448.png" alt="Saint Ferdinand College Logo" class="w-12 h-12 object-contain rounded-full bg-white p-0.5 border border-amber-400">
                <div>
                    <h1 class="text-sm sm:text-base font-bold text-white leading-tight">Saint Ferdinand College</h1>
                    <p class="text-xs text-amber-300 font-medium">College of Nursing &bull; Interactive Test Practice Hub</p>
                </div>
            </div>
            <a href="index.html" class="bg-emerald-800 hover:bg-emerald-700 text-amber-300 text-xs font-bold px-4 py-2 rounded-lg border border-emerald-700 transition-colors flex items-center gap-2">
                <i class="fa-solid fa-house"></i> Return to Main Portal
            </a>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-12 flex-1 space-y-8">
        
        <!-- Header Banner & Filter Control -->
        <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
            <div class="space-y-2">
                <span class="bg-amber-100 text-amber-900 font-bold text-xs px-3 py-1 rounded-full uppercase">Departmental Examination Hub</span>
                <h2 class="text-3xl font-extrabold text-slate-900">Interactive Test Practice Directory</h2>
                <p class="text-sm text-slate-600">Select a  topic below to launch its dedicated interactive exam file.</p>
            </div>

            <!-- Category Filter Dropdown -->
            <div class="flex items-center space-x-2 bg-slate-50 p-2.5 rounded-xl border border-slate-300 w-full md:w-auto">
                <label for="examFilter" class="text-xs font-bold text-slate-700 whitespace-nowrap">Filter Topics:</label>
                <select id="examFilter" onchange="filterExams(this.value)" class="bg-white text-xs font-semibold text-slate-800 p-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-700 cursor-pointer w-full md:w-64">
                    <option value="all">📁 Show All Exams</option>
                    <option value="Fundamentals">Test Practice 1</option>
                    <option value="FUNDAMENTALS">Test Practice 2</option>
					<option value="OB">Test Practice 3</option
                </select>
            </div>
        </div>

        <!-- EXAM CARDS GRID (Links to individual topic HTML files) -->
        <div id="examGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">

            <!-- Card 1: funda Exam 1 -->
            <div class="exam-card bg-white p-8 rounded-2xl shadow-sm border border-slate-200 hover:shadow-md transition-shadow flex flex-col justify-between space-y-6" data-category="research">
                <div class="space-y-4">
                    <div class="flex justify-between items-center">
                        <span class="bg-emerald-100 text-emerald-800 font-bold text-xs px-3 py-1 rounded-full uppercase">PRACTICE EXAM 1</span>
                        <span class="text-xs text-slate-400 font-semibold"><i class="fa-regular fa-clock mr-1"></i>Interactive</span>
                    </div>
                    <h3 class="text-2xl font-bold text-slate-900">FUNDAMENTALS OF NURSING</h3>
                    <p class="text-xs font-bold text-emerald-700">NCM 103</p>
                    <p class="text-xs text-slate-600 leading-relaxed">
                        Practice Exam in Fundamentals of Nursing Practice
                    </p>
                    <div class="text-xs text-slate-500 border-t pt-3">
                        <p><strong>Instructor:</strong> RENE S. REAL, RN</p>
                    </div>
                </div>
                <a href="practicetest_1.html" target="_blank" class="w-full text-center bg-emerald-800 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow transition-colors flex items-center justify-center gap-2">
                    <i class="fa-solid fa-pen-to-square"></i> Launch Exam &rarr;
                </a>
            </div>

            <!-- Card 2: funda exam 2 -->
            <div class="exam-card bg-white p-8 rounded-2xl shadow-sm border border-slate-200 hover:shadow-md transition-shadow flex flex-col justify-between space-y-6" data-category="medsurg">
                <div class="space-y-4">
                    <div class="flex justify-between items-center">
                        <span class="bg-amber-100 text-amber-800 font-bold text-xs px-3 py-1 rounded-full uppercase">Practice Exam 2</span>
                        <span class="text-xs text-slate-400 font-semibold"><i class="fa-regular fa-clock mr-1"></i>Interactive</span>
                    </div>
                    <h3 class="text-2xl font-bold text-slate-900">FUNDAMENTALS 2 - EASY</h3>
                    <p class="text-xs font-bold text-amber-700">NCM 103</p>
                    <p class="text-xs text-slate-600 leading-relaxed">
                      Practice Exam in Fundamentals of Nursing Practice 2- EASY
                    </p>
                    <div class="text-xs text-slate-500 border-t pt-3">
                        <p><strong>Course Faculty:</strong> RENE S. REAL, RN</p>
                    </div>
                </div>
                <a href="practicetest_2.html" target="_blank" class="w-full text-center bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-xl shadow transition-colors flex items-center justify-center gap-2">
                    <i class="fa-solid fa-stethoscope"></i> Launch Exam &rarr;
                </a>
            </div>
			<!-- Card 3: maternal -->
            <div class="exam-card bg-white p-8 rounded-2xl shadow-sm border border-slate-200 hover:shadow-md transition-shadow flex flex-col justify-between space-y-6" data-category="medsurg">
                <div class="space-y-4">
                    <div class="flex justify-between items-center">
                        <span class="bg-amber-100 text-amber-800 font-bold text-xs px-3 py-1 rounded-full uppercase">Practice Exam 3</span>
                        <span class="text-xs text-slate-400 font-semibold"><i class="fa-regular fa-clock mr-1"></i>Interactive</span>
                    </div>
                    <h3 class="text-2xl font-bold text-slate-900">Maternal and Child at Risk</h3>
                    <p class="text-xs font-bold text-amber-700">NCM 109</p>
                    <p class="text-xs text-slate-600 leading-relaxed">
                      Practice Exam in Maternal and Child Nursing
                    </p>
                    <div class="text-xs text-slate-500 border-t pt-3">
                        <p><strong>Course Faculty:</strong> RENE S. REAL, RN</p>
                    </div>
                </div>
                <a href="OB.html" target="_blank" class="w-full text-center bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-xl shadow transition-colors flex items-center justify-center gap-2">
                    <i class="fa-solid fa-stethoscope"></i> Launch Exam &rarr;
                </a>
            </div>
            <!-- Template Card for Future Topic Exams -->
            <div class="exam-card bg-white p-8 rounded-2xl shadow-sm border border-dashed border-slate-300 flex flex-col justify-between space-y-6 opacity-80" data-category="medsurg">
                <div class="space-y-4">
                    <div class="flex justify-between items-center">
                        <span class="bg-blue-100 text-blue-800 font-bold text-xs px-3 py-1 rounded-full uppercase">Future Exam</span>
                        <span class="text-xs text-slate-400 font-semibold">Coming Soon</span>
                    </div>
                    <h3 class="text-2xl font-bold text-slate-700">OB CONCEPTS</h3>
                    <p class="text-xs font-bold text-blue-700">Maternal & Child Nursing</p>
                    <p class="text-xs text-slate-500 leading-relaxed">
                </div>
                <button disabled class="w-full text-center bg-slate-200 text-slate-400 font-bold py-3 rounded-xl cursor-not-allowed block">
                    Exam in Preparation
                </button>
            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
        <p>Saint Ferdinand College - College of Nursing | Ilagan City, Isabela &bull; Established 1950</p>
    </footer>

    <!-- Filter Script -->
    <script>
        function filterExams(category) {
            const cards = document.querySelectorAll('.exam-card');
            cards.forEach(card => {
                if (category === 'all' || card.getAttribute('data-category') === category) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
